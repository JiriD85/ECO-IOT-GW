# ECO-IOT-GW Captive Portal Configuration
# NoDogSplash configuration for WiFi AP

GatewayInterface wlan0
GatewayAddress 192.168.4.1
GatewayPort 2050
MaxClients 250

# Redirect all unauthenticated clients to gateway
GatewayName ECO-IOT-GW Setup

# Authentication method
AuthIdleTimeout 480
AuthCallTimeout 60

# Traffic control - unlimited for setup
DownloadLimit 0
UploadLimit 0

# Whitelist the management interface
TrustedMACList none

# Firewall rules
FirewallRuleSet authenticated-users {
    FirewallRule allow all
}

FirewallRuleSet preauthenticated-users {
    # Allow DNS
    FirewallRule allow tcp port 53
    FirewallRule allow udp port 53
    # Allow DHCP
    FirewallRule allow udp port 67
    # Allow access to gateway web interface
    FirewallRule allow tcp port 80
    FirewallRule allow tcp port 443
}

# Status page
StatusPath /status

# Redirect URL - to our management interface
RedirectURL https://192.168.4.1/

# Page directory (optional - for custom splash page)
# HtmlMessageFile /etc/nodogsplash/htdocs/splash.html
