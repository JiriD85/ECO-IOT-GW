# ECO-IOT-GW Docker Compose
# ThingsBoard IoT Gateway

version: '3.8'

services:
  tb-gateway:
    image: thingsboard/tb-gateway:latest
    container_name: tb-gateway
    restart: unless-stopped
    volumes:
      - ./gateway/config:/thingsboard-gateway/config
      - ./gateway/logs:/thingsboard-gateway/logs
      - ./gateway/extensions:/thingsboard-gateway/extensions
    environment:
      - TZ=Europe/Berlin
    devices:
      # RS485 serial port
      - /dev/ttyAMA0:/dev/ttyAMA0
    network_mode: host
    privileged: true
